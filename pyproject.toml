[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscan"
version = "0.5.0"
description = "AgentScan —— AI Agent 安全检测平台：真实探测区分 AGENT 与裸模型，托管沙箱工具做注入/泄露/越权/外带（DNS+HTTP 金丝雀）/MCP 投毒多维检测，输出带真实证据的报告（支持本地与 docker 目标）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TSVMV" }]
keywords = ["agent", "llm", "security", "prompt-injection", "redteam", "owasp", "docker"]
dependencies = ["requests"]

[project.scripts]
agentscan = "agentscan.cli:main"

[tool.setuptools.packages.find]
include = ["agentscan*"]
